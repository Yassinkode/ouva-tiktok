name: Post a ready video
on:
  push:
    paths: ['data/post/post.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node pipeline/post_file.mjs
      - if: always()
        run: |
          git config user.name "ouva-bot"
          git config user.email "ouva-bot@users.noreply.github.com"
          git add data/post/result.json || true
          git diff --cached --quiet || (git commit -m "posted: special video" && git pull --rebase -q && git push)
