name: Pixabay fetch
on:
  push:
    paths: ['data/fetch/pixabay.json']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download tracks
        run: |
          mkdir -p public/bgcand
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          jq -c '.[]' data/fetch/pixabay.json | while read -r it; do
            U=$(echo "$it" | jq -r .page); O=$(echo "$it" | jq -r .id)
            curl -fsSL -A "$UA" "$U" -o /tmp/p.html || { echo "page fail $O"; continue; }
            M=$(grep -oE 'https://cdn\.pixabay\.com/(download/)?audio/[^"\\ ]+\.mp3[^"\\ ]*' /tmp/p.html | head -1)
            echo "$O -> $M"
            [ -n "$M" ] && curl -fsSL -A "$UA" -e "$U" "$M" -o "public/bgcand/$O.mp3" && ls -la "public/bgcand/$O.mp3"
          done
      - name: Commit
        run: |
          git config user.name "ouva-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f public/bgcand || true; git commit -m "bg candidates" || exit 0; git pull --rebase; git push
