name: Voice samples
on:
  push:
    paths: ['samples/request.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -q edge-tts
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node pipeline/voice_samples.mjs
      - run: |
          git config user.name "ouva-bot"
          git config user.email "ouva-bot@users.noreply.github.com"
          git add samples/*.mp3 samples/text.txt
          git diff --cached --quiet || (git commit -m "voice samples" && git pull --rebase -q && git push)
