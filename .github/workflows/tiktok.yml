name: OùVa TikTok

on:
  schedule:
    # 1 vidéo tous les 2 jours (~15/mois, compatible avec le quota ElevenLabs gratuit).
    # 15:00 UTC = 17h (été) / 16h (hiver) à Paris → la vidéo arrive sur Telegram vers 17h30-18h.
    - cron: '0 15 */2 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test (1 = la vidéo est marquée [TEST] et ne compte pas dans la réserve)'
        required: false
        default: '1'
      telegram_only:
        description: 'Juste tester Telegram / Zernio (1 = oui, 30 s)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: ouva-tiktok
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System deps
        if: github.event.inputs.telegram_only != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Python deps
        if: github.event.inputs.telegram_only != '1'
        run: pip install -q numpy scipy pedalboard

      - name: Node deps
        if: github.event.inputs.telegram_only != '1'
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Telegram check
        if: github.event.inputs.telegram_only == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: |
          node pipeline/telegram.mjs test
          if [ -n "$ZERNIO_API_KEY" ]; then node pipeline/zernio.mjs check && node pipeline/telegram.mjs say "Zernio connecté ✅ : les prochaines vidéos seront publiées automatiquement sur TikTok."; fi

      - name: Make & deliver video
        if: github.event.inputs.telegram_only != '1'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # optionnels (payants) : écriture auto des histoires + publication directe TikTok
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          # gratuit : publication automatique sur TikTok via Zernio
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          STORY_MODEL: ${{ vars.STORY_MODEL }}
          SLOT: '18'
          DRY_RUN: ${{ github.event.inputs.dry_run || (vars.PAUSED == '1' && '1') || '0' }}
        run: node pipeline/run.mjs

      - name: Keep the video (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: out/OuVa_*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save history
        if: always()
        run: |
          git config user.name "ouva-bot"
          git config user.email "ouva-bot@users.noreply.github.com"
          git add data/history.json data/telegram.json || true
          git diff --cached --quiet || (git commit -m "video: $(date -u +%F)" && git pull --rebase -q && git push)
